<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Solar Water Filter</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #eef5ff;
}

h1 { color:#0d47a1; }

.info {
  display:flex;
  justify-content:center;
  gap:20px;
  margin:20px;
  flex-wrap:wrap;
}

.box {
  padding:10px 20px;
  border-radius:8px;
  color:white;
  font-weight:bold;
}

.battery { background:green; }
.status { background:orange; }

.system {
  display:flex;
  justify-content:flex-start;
  align-items:flex-end;
  gap:40px;
  margin-top:40px;
  overflow-x:auto;
  padding:20px;
}

.tank {
  width:180px;
  height:180px;
  min-width:180px;
  border:3px solid #333;
  border-radius:10px;
  position:relative;
  background:#fff;
  overflow:hidden;
}

.water {
  position:absolute;
  width:100%;
  height:0%;
}

.t1 { background:#c8a24a; }
.t2 { background:#8fd3f4; }
.t3 { background:#2196f3; }

.particles {
  position:absolute;
  width:100%;
  height:100%;
  background-image: radial-gradient(#000 1px, transparent 1px);
  background-size:10px 10px;
  opacity:0.25;
}

.pipe {
  width:100px;
  height:16px;
  background:#777;
  border-radius:8px;
  overflow:hidden;
  position:relative;
}

.flow {
  width:200%;
  height:100%;
  background: linear-gradient(90deg, transparent, #4fc3f7, transparent);
  position:absolute;
  left:-100%;
  animation: flowMove 1s linear infinite;
  display:none;
}

@keyframes flowMove {
  from { left:-100%; }
  to { left:100%; }
}

button {
  margin:15px;
  padding:10px 25px;
  border:none;
  border-radius:8px;
  background:#0d47a1;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<h1>Smart Solar Water Filter</h1>

<div class="info">
  <div class="box battery">Battery: <span id="battery">100%</span></div>
  <div class="box status"><span id="status">System Ready</span></div>
</div>

<div class="system">

  <div class="tank">
    <div id="w1" class="water t1"><div class="particles"></div></div>
  </div>

  <div class="pipe"><div id="f1" class="flow"></div></div>

  <div class="tank">
    <div id="w2" class="water t2"><div class="particles"></div></div>
  </div>

  <div class="pipe"><div id="f2" class="flow"></div></div>

  <div class="tank">
    <div id="w3" class="water t3"></div>
  </div>

</div>

<button onclick="startSystem()">START</button>
<button onclick="emptyTank()">EMPTY</button>

<script>

let battery = 100;
let tankFull = false;
let running = false;

let drainInterval;
let chargeInterval;

function startSystem(){

  if(tankFull){
    document.getElementById("status").innerHTML = "Tank Full – Water cannot be filtered";
    return;
  }

  if(running) return;

  clearInterval(chargeInterval);
  running = true;

  let steps = [
    " Solar system ON",
    " Pump started",
    " Dirty water entering"
  ];

  let i = 0;
  let stepInterval = setInterval(()=>{
    if(i < steps.length){
      document.getElementById("status").innerHTML = steps[i++];
    } else clearInterval(stepInterval);
  },1000);

  let h = 0;

  let fill1 = setInterval(()=>{
    if(h < 100){
      h++;
      document.getElementById("w1").style.height = h + "%";
    } else {
      clearInterval(fill1);
      transfer1();
    }
  },100);

  drainInterval = setInterval(()=>{
    if(battery > 60){
      battery--;
      document.getElementById("battery").innerHTML = battery + "%";
    }
  },500);
}

function transfer1(){

  let steps = [
    " Gravel filtering",
    " Sand filtering",
    "Charcoal filtering"
  ];

  let i = 0;
  let stepInterval = setInterval(()=>{
    if(i < steps.length){
      document.getElementById("status").innerHTML = steps[i++];
    } else clearInterval(stepInterval);
  },1200);

  document.getElementById("f1").style.display = "block";

  let l1 = 100, l2 = 0;

  let move = setInterval(()=>{
    if(l1 > 0){
      l1--; l2++;
      document.getElementById("w1").style.height = l1 + "%";
      document.getElementById("w2").style.height = l2 + "%";
    } else {
      clearInterval(move);
      document.getElementById("f1").style.display = "none";
      transfer2();
    }
  },100);
}

function transfer2(){

  let steps = [
    " Final cleaning",
    "Clean water ready!"
  ];

  let i = 0;
  let stepInterval = setInterval(()=>{
    if(i < steps.length){
      document.getElementById("status").innerHTML = steps[i++];
    } else clearInterval(stepInterval);
  },1200);

  document.getElementById("f2").style.display = "block";

  let l2 = 100, l3 = 0;

  let move = setInterval(()=>{
    if(l2 > 0){
      l2--; l3++;
      document.getElementById("w2").style.height = l2 + "%";
      document.getElementById("w3").style.height = l3 + "%";
    } else {
      clearInterval(move);
      document.getElementById("f2").style.display = "none";
      tankFull = true;
      running = false;
    }
  },100);
}

function emptyTank(){

  document.getElementById("w3").style.height = "0%";
  document.getElementById("status").innerHTML = "Charging Battery";

  tankFull = false;

  clearInterval(drainInterval);
  clearInterval(chargeInterval);

  chargeInterval = setInterval(()=>{
    if(battery < 100){
      battery++;
      document.getElementById("battery").innerHTML = battery + "%";
    } else {
      clearInterval(chargeInterval);
      document.getElementById("status").innerHTML = "System Ready";
    }
  },200);
}

</script>

</body>
</html>
